$kind: http-request
name: Create user.
description: This can only be done by the logged in user.
url: "{{baseUrl}}/user"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "id": {{$randomInt}},
      "username": "{{$randomUserName}}",
      "firstName": "{{$randomFirstName}}",
      "lastName": "{{$randomLastName}}",
      "email": "{{$randomExampleEmail}}",
      "password": "{{password}}",
      "phone": "{{$randomPhoneNumber}}",
      "userStatus": {{userStatus}}
    }
scripts:
  - type: afterResponse
    code: |-
      let requestBody = pm.request.body.raw;

      let sentData = null;
      let parseError = null;

      try {
          sentData = JSON.parse(requestBody);
      }
      catch (e) {
          parseError = e;
      }

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Проверка что JSON ответа валидный", function () {
          pm.expect(() => {pm.response.json(); }).not.to.throw();
      });

      pm.test("Тело запроса является валидным JSON", function () {
          pm.expect(parseError, `тело запроса не парсится: ${parseError}`).to.equal(null);
      });

      pm.test("Проверка что username запроса и ответа совпадают", function () {
          const res = pm.response.json();
          pm.expect(res.username, "username в ответе не совпадает с отправленным").to.eql(sentData.username);
      });

      if (sentData) {
          pm.collectionVariables.set("userName", sentData.username);
          pm.collectionVariables.set("id", sentData.id);
          pm.collectionVariables.set("firstName", sentData.firstName);
          pm.collectionVariables.set("lastName", sentData.lastName);
          pm.collectionVariables.set("email", sentData.email);
          pm.collectionVariables.set("phone", sentData.phone);
      }
    language: text/javascript
settings: {}
examples: ./.resources/Create user-.resources/examples
order: 1000
