$kind: http-request
name: Get user by user name.
description: Get user detail based on username.
url: "{{baseUrl}}/user/:username"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: username
    value: "{{userName}}"
    description: The name that needs to be fetched. Use user1 for testing
scripts:
  - type: afterResponse
    code: |-
      let responseJson = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Content-Type содержит application/json", () => {
          pm.expect(pm.response.headers.get("Content-Type") || "").to.include("application/json");
      });

      pm.test("Проверка что JSON ответа валидный", () => {
          pm.expect(() => { pm.response.json(); }).not.to.throw();
      });

      pm.test("ID пользователя положительное целое число", () => {
          pm.expect(Number.isInteger(responseJson.id)).to.be.true;
          pm.expect(responseJson.id).to.be.above(0);
      });

      pm.test("Формат email в ответе корректный", () => {
          pm.expect(responseJson.email).to.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/);
      });

      pm.test("Status пользователя положительное целое число", () => {
          pm.expect(Number.isInteger(responseJson.userStatus)).to.be.true;
          pm.expect(responseJson.userStatus).to.be.at.least(0);
      });

      /*
      Можно включить данную проверку, но она обычно применяется для API проверок,
      где используется микросервисная архитектура и необходимо строго соблюдать контракты
      между микросервисами.
      */

      // pm.test("Проверка JSON schema", function () {
      //     const schema = {
      //         type: "object",
      //         required: ["id", "username", "firstName", "lastName", "email", "password", "phone", "userStatus"],
      //         properties: {
      //             id: { type: "integer" },
      //             username: { type: "string" },
      //             firstName: { type: "string" },
      //             lastName: { type: "string" },
      //             email: { type: "string" },
      //             password: { type: "string" },
      //             phone: { type: "string" },
      //             userStatus: { type: "integer" }
      //         },
      //         additionalProperties: false
      //     };
      //     pm.expect(responseJson).to.have.jsonSchema(schema);
      // });
    language: text/javascript
settings: {}
examples: ./.resources/Get user by user name-.resources/examples
order: 1000
