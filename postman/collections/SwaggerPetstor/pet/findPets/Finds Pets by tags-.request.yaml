$kind: http-request
name: Finds Pets by tags.
description: Multiple tags can be provided with comma separated strings. Use tag1, tag2, tag3 for testing.
url: "{{baseUrl}}/pet/findByTags?tags=tag1&tags=tag2"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: tags
    value: tag1
    description: Tags to filter by
  - key: tags
    value: tag2
    description: Tags to filter by
auth:
  type: oauth2
  credentials:
    authUrl: https://petstore3.swagger.io/oauth/authorize
    scope: write:pets read:pets
    grant_type: implicit
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      /*\r

      Должна быть проверка, где мы спускаемся для каждго объекта\r

      массива до ключа tags, проходим по всему масиву значений\r

      данного ключа и проверяем, что каждый ключ name содержит\r

      переданный в параметрах тэг(и)\r

      https://youtu.be/ytGpXdQXa8g\r

      */\r

      \r

      /*\r

      Если бы это была не тестовая коллекция, то мы могли иметь\r

      словарь тэгов и подключить его в качестве источника, \r

      чтобы в разных прогонах иметь уникальные выборки\r

      */"
    language: text/javascript
settings: {}
examples: ./.resources/Finds Pets by tags-.resources/examples
order: 3000
