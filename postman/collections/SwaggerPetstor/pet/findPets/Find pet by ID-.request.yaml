$kind: http-request
name: Find pet by ID.
description: Returns a single pet.
url: "{{baseUrl}}/pet/:petId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: petId
    value: "{{pet_id}}"
    description: ID of pet to return
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{apiKey}}"
    in: header
scripts:
  - type: afterResponse
    code: |-
      const resp = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("В ответе корректно указан id животного", () => {
          pm.expect(pm.collectionVariables.get("pet_id")).is.eql(resp.id);
      });
    language: text/javascript
settings: {}
examples: ./.resources/Find pet by ID-.resources/examples
order: 2000
