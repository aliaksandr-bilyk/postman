$kind: http-request
name: Finds Pets by status.
description: Multiple status values can be provided with comma separated strings.
url: "{{baseUrl}}/pet/findByStatus?status={{pet_status}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: status
    value: "{{pet_status}}"
    description: Status values that need to be considered for filter
auth:
  type: oauth2
  credentials:
    authUrl: https://petstore3.swagger.io/oauth/authorize
    scope: write:pets read:pets
    grant_type: implicit
scripts:
  - type: afterResponse
    code: |-
      let body = null;
      let parseError = null;

      try {
          body = pm.response.json();
      }
      catch (e) {
          parseError = e;
      }

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Все ID животных положительные целочисленные значения", () => {
          pm.expect(parseError, `тело ответа не разбирается: ${parseError}`).to.equal(null);
          pm.expect(body).to.be.an("array");

          const pets = body.filter(function (pet) {
              return pet && pet.id !== 0;
          });

          pets.forEach((pet, index) => {
              pm.expect(pet.id, `item ${index}.id`).to.be.a("number").and.satisfy(Number.isInteger).and.above(0);
          });
      });
    language: text/javascript
  - type: beforeRequest
    code: "const randomStatus = pm.environment.get(\"list_pet_statuses\").split(',')[Math.floor(Math.random() * 3)];\r

      \r

      pm.collectionVariables.set(\"pet_status\", randomStatus);\r

      \r

      console.log(\"Для этого запроса выбран статус: \" + randomStatus.trim());"
    language: text/javascript
settings: {}
examples: ./.resources/Finds Pets by status-.resources/examples
order: 1000
