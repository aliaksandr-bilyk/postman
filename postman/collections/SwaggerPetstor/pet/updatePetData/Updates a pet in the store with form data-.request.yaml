$kind: http-request
name: Updates a pet in the store with form data.
description: Updates a pet resource based on the form data.
url: "{{baseUrl}}/pet/:petId?name={{pet_name}}_form&status={{pet_status}}"
method: POST
headers:
  Accept: application/json
queryParams:
  - key: name
    value: "{{pet_name}}_form"
    description: Name of pet that needs to be updated
  - key: status
    value: "{{pet_status}}"
    description: Status of pet that needs to be updated
pathVariables:
  petId: "{{pet_id}}"
auth:
  type: oauth2
  credentials:
    authUrl: https://petstore3.swagger.io/oauth/authorize
    scope: write:pets read:pets
    grant_type: implicit
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();

      const before = pm.collectionVariables.get("pet_name");
      const after = response.name;

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Имя животного обновилось", function () {
          pm.expect(after, "в ответе нет имени").to.be.a("string").and.not.empty;
          pm.expect(after, "имя не изменилось").to.not.equal(before);
          pm.expect(after, "имя не равно {{pet_name}}_form").to.equal(before + "_form");
      });

      if (typeof after === "string" && after !== "") {
          pm.collectionVariables.set("pet_name", after);
      }
    language: text/javascript
settings: {}
examples: ./.resources/Updates a pet in the store with form data-.resources/examples
order: 3000
