$kind: http-request
name: Add a new pet to the store.
description: Add a new pet to the store.
url: "{{baseUrl}}/pet"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "{{$randomFirstName}}",
      "photoUrls": [
        "{{$randomCatsImage}}",
        "{{$randomCatsImage}}"
      ],
      "id": {{pet_id}},
      "category": {
        "id": 2,
        "name": "Cats"
      },
      "tags": [
        {
          "id": 2421,
          "name": "string"
        },
        {
          "id": 4995,
          "name": "string"
        }
      ],
      "status": "{{pet_status}}"
    }
auth:
  type: oauth2
  credentials:
    authUrl: https://petstore3.swagger.io/oauth/authorize
    scope: write:pets read:pets
    grant_type: implicit
scripts:
  - type: beforeRequest
    code: |-
      const list = pm.collectionVariables.get("list_pet_statuses") || "available,pending,sold";
      const statuses = list.split(",").map(s => s.trim()).filter(Boolean);
      const randomStatus = statuses[Math.floor(Math.random() * statuses.length)] || "available";

      // id из диапазона 1000..9999 - не пересекается с сид-данными (1,2,4,7,8,9,10)
      const randomPetId = Math.floor(Math.random() * 9000) + 1000;

      pm.collectionVariables.set("pet_status", randomStatus);
      pm.collectionVariables.set("pet_id", randomPetId);
    language: text/javascript
  - type: afterResponse
    code: "const reqObj = JSON.parse(pm.request.body.raw);\r

      const resObj = pm.response.json();\r

      \r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Тело запроса и тело ответа полностью совпадают\", function () {\r

      \    pm.expect(reqObj).to.eql(resObj);\r

      });\r

      \r

      pm.collectionVariables.set(\"pet_name\", resObj.name)"
    language: text/javascript
settings: {}
examples: ./.resources/Add a new pet to the store-.resources/examples
order: 1000
