$kind: http-request
name: Place an order for a pet.
description: Place a new order in the store.
url: "{{baseUrl}}/store/order"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "id": {{$randomInt}},
      "petId": {{pet_id}},
      "quantity": {{quantity}},
      "shipDate": "{{shipDate}}",
      "status": "approved",
      "complete": false
    }
scripts:
  - type: beforeRequest
    code: |-
      // shipDate обязан быть в будущем - тест сравнивает его с моментом прогона
      pm.collectionVariables.set("shipDate", new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString());

      const inventoryRequest = {
          url: pm.variables.replaceIn("{{baseUrl}}/store/inventory"),
          method: "GET",
          header: {
              Accept: "application/json",
              api_key: pm.variables.replaceIn("{{apiKey}}")
          }
      };

      pm.sendRequest(inventoryRequest, function (error, response) {
          if (error) {
              throw new Error(`Запрос получения данных о заказах не выполнен: ${error.message || error}`);
          }
          if (!response || response.code < 200 || response.code >= 300) {
              throw new Error(`Запрос получения данных о заказах выполнен с ошибкой ${response ? response.code : "no response"}`);
          }

          let inventory;

          try {
              inventory = response.json();
          } catch (parseError) {
              throw new Error(`Before-order inventory response is not valid JSON: ${parseError.message}`);
          }

          const approved = inventory && inventory.approved;
          
          if (typeof approved !== "number" || !Number.isFinite(approved)) {
              throw new Error(`Before-order inventory key "approved" must be numeric; received ${JSON.stringify(approved)}`);
          }

          pm.variables.set("approvedBeforeOrder", approved);
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      let reqObj = null;
      let parseError = null;

      try {
          reqObj = JSON.parse(pm.request.body.raw);
      }
      catch (e) {
          parseError = e;
      }

      const localDate = new Date();
      const shipDateStr = pm.collectionVariables.get("shipDate");
      const shipDate = new Date(shipDateStr);

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("В ответ приходит валидный JSON", function () {
          pm.expect(parseError, `тело запроса не парсится: ${parseError}`).to.equal(null);
      });

      pm.test("Дата отправления задана и не раньше текущей", function () {
          pm.expect(parseError, `тело запроса не разбирается: ${parseError}`).to.equal(null);
          pm.expect(shipDate, `дата отправления (${shipDateStr}) должна быть не раньше текущей`).to.be.greaterThanOrEqual(localDate);
      });

      pm.test("Количество товара в заказе больше 0", function () {
          const qty = Number(pm.collectionVariables.get("quantity"));
          pm.expect(qty, `количество товара в заказе (${qty}) должно быть больше 0`).to.be.greaterThan(0);
      });

      if (reqObj) {
          pm.collectionVariables.set("order_id", reqObj.id);
      }

      const inventoryRequest = {
          url: pm.variables.replaceIn("{{baseUrl}}/store/inventory"),
          method: "GET",
          header: {
              Accept: "application/json",
              api_key: pm.variables.replaceIn("{{apiKey}}")
          }
      };

      pm.sendRequest(inventoryRequest, function (error, response) {
          pm.test("Проверка корректности запроса данных в инвентаре", () => {
              pm.expect(error, `Запрос завершился с ошибкой: ${error && (error.message || error)}`).to.equal(null);
              pm.expect(response.code, `Запрос получения данных о заказах выполнен с ошибкой ${response.code}`).to.be.within(200, 299);
          });

          if (error || !response || response.code < 200 || response.code >= 300) {
              return;
          }

          let inventory;
          
          try {
              inventory = response.json();
          } catch (e) {
              inventoryParseError = e;
          }

          const approvedBeforeRaw = pm.variables.get("approvedBeforeOrder");
          const approvedBefore = Number(approvedBeforeRaw);
          const approvedAfter = inventory && inventory.approved;

          pm.test("Проверка что кол-во approved в инвентаре увеличилась", function () {
              pm.expect(approvedAfter, `Ожидалось approved увеличилось в сравнении с ${approvedBefore}, но получено ${approvedAfter}`).to.be.greaterThan(approvedBefore);
          });
      });
    language: text/javascript
settings: {}
examples: ./.resources/Place an order for a pet-.resources/examples
order: 1000
