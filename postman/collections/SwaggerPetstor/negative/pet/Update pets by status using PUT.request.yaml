$kind: http-request
description: "Таблица решений: строка «метод PUT × эндпоинт, принимающий только GET»"
url: "{{baseUrl}}/pet/findByStatus"
method: PUT
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Метод PUT эндпоинт не поддерживает — 405", function () {
          pm.response.to.have.status(405);
      });

      pm.test("Ошибка имеет структуру {code, message}", () => {
          const e = pm.response.json();
          pm.expect(Object.keys(e).sort()).to.eql(["code", "message"]);
      });

      pm.test("Код в теле совпадает со статусом, причина - недопустимый метод", () => {
          const e = pm.response.json();
          pm.expect(e.code).to.eql(405);
          pm.expect(e.message).to.eql("HTTP 405 Method Not Allowed");
      });
    language: text/javascript
settings: {}
order: 11000
