$kind: http-request
description: Обязательный query-параметр status не передан
url: "{{baseUrl}}/pet/findByStatus"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Тело ответа содержит сообщение об ошибке", () => {
          pm.expect(pm.response.text()).to.include("missing required query parameter `status`");
      });
    language: text/javascript
settings: {}
order: 1000
