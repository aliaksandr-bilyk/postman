$kind: http-request
description: Удаление с нечисловым id в пути
url: "{{baseUrl}}/pet/abc"
method: DELETE
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Тело ответа содержит сообщение об ошибке", () => {
          pm.expect(pm.response.text()).to.include("couldn't convert `abc`");
      });
    language: text/javascript
settings: {}
order: 7000
