$kind: http-request
description: Значение status вне перечисления [available, pending, sold]
url: "{{baseUrl}}/pet/findByStatus?status=zzz"
method: GET
headers:
  Accept: application/json
queryParams:
  status: zzz
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Тело ответа содержит сообщение об ошибке", () => {
          pm.expect(pm.response.text()).to.include("is not in the allowable values");
      });
    language: text/javascript
settings: {}
order: 2000
