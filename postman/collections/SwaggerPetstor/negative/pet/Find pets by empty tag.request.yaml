$kind: http-request
description: Передан пустой тег
url: "{{baseUrl}}/pet/findByTags?tags="
method: GET
headers:
  Accept: application/json
queryParams:
  tags: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Тело ответа содержит сообщение об ошибке", () => {
          pm.expect(pm.response.text()).to.include("No tags provided");
      });
    language: text/javascript
settings: {}
order: 4000
