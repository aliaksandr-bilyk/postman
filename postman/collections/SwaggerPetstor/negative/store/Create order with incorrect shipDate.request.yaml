$kind: http-request
description: "Эквивалентные классы: значение вне класса «корректный date-time»"
url: "{{baseUrl}}/store/order"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"petId\": 1,\r

    \    \"quantity\": 1,\r

    \    \"shipDate\": \"some date\",\r

    \    \"status\": \"placed\",\r

    \    \"complete\": false\r

    }"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Ошибка имеет структуру {code, message} и code совпадает со статусом", () => {
          const e = pm.response.json();
          pm.expect(Object.keys(e).sort()).to.eql(["code", "message"]);
          pm.expect(e.code).to.eql(400);
      });

      pm.test("Причина — отказ приведения тела запроса к модели Order", () => {
          pm.expect(pm.response.json().message).to.include("unable to convert input to io.swagger.petstore.model.Order");
      });

      pm.test("Сущность не создана: в ответе нет полей заказа", () => {
          const t = pm.response.text();
          pm.expect(t).to.not.include('"quantity"');
          pm.expect(t).to.not.include('"petId"');
          pm.expect(t).to.not.include('"shipDate"');
      });
    language: text/javascript
settings: {}
order: 6000
