$kind: http-request
description: Заказ с несуществующим id
url: "{{baseUrl}}/store/order/999999999"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });

      pm.test("Тело ответа содержит сообщение об ошибке", () => {
          pm.expect(pm.response.text()).to.include("Order not found");
      });
    language: text/javascript
settings: {}
order: 2000
