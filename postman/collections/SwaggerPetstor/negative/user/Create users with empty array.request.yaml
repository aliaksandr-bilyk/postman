$kind: http-request
description: Перан пустой массив вместо списка пользователей
url: "{{baseUrl}}/user/createWithList"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "[]"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Тело ответа содержит сообщение об ошибке", () => {
          pm.expect(pm.response.text()).to.include("No User provided");
      });
    language: text/javascript
settings: {}
order: 3000
