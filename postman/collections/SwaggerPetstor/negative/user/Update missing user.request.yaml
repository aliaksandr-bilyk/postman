$kind: http-request
description: "Таблица решений: строка «метод PUT × сущность не существует»"
url: "{{baseUrl}}/user/nonexistent_user_404"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });

      pm.test(`Тело ровно "User not found"`, () => {
          pm.expect(pm.response.text().trim()).to.eql("User not found");
      });
    language: text/javascript
settings: {}
order: 4000
