$kind: http-request
description: Запрос пользователя, которого не существует
url: "{{baseUrl}}/user/nonexistent_user_404"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });

      pm.test("Тело ответа содержит сообщение об ошибке", () => {
          pm.expect(pm.response.text()).to.include("User not found");
      });
    language: text/javascript
settings: {}
order: 1000
